<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration des diplômes</title>
   <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="container">

        <p><a href="index.html">← Accueil</a></p>

        <h1>Administration des diplômes</h1>

        <p>Enregistrer un nouveau diplôme sur la Blockchain</p>

        <button type="button" id="connectBtn">
            Connecter MetaMask
        </button>

        <p id="accountStatus" role="status">
            Portefeuille non connecté
        </p>

        <hr>

        <form id="adminForm">

            <label for="nom">Nom :</label>
            <input type="text" id="nom" required>

            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" required>

            <label for="filiere">Filière :</label>
            <input type="text" id="filiere" required>

            <label for="annee">Année :</label>
            <input type="number" id="annee"
                   min="1900" max="2100" required>

            <label for="pdf">Diplôme PDF :</label>
            <input type="file" id="pdf"
                   accept=".pdf,application/pdf" required>

            <button type="submit" id="emitBtn">
                Émettre le diplôme
            </button>

        </form>

        <p id="status" role="status"></p>

    </main>

    <script type="module" src="../js/admin.js"></script>

</body>
</html>
